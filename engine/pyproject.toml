[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powergis-engine"
version = "1.0.0"
description = "Motor de informes de geomarketing de PowerGIS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "PowerGIS" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "geoalchemy2>=0.15",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.27",
    "typer>=0.15",
    "xlsxwriter>=3.2",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63.0"]
geo = ["shapely>=2.0", "pyproj>=3.7", "h3>=4.1"]
observability = ["sentry-sdk>=2.19", "prometheus-client>=0.21", "flower>=2.0"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "freezegun>=1.5",
]

[project.scripts]
powergis = "powergis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powergis"]

[tool.hatch.build]
include = ["src/powergis/seed/*.json"]

# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requiere PostgreSQL con PostGIS",
    "network: llama a APIs externas reales",
]
filterwarnings = ["error::DeprecationWarning:powergis.*"]

[tool.coverage.run]
source = ["src/powergis"]
omit = ["*/alembic/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "N",                 # naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "RUF",               # ruff propias
    "S",                 # bandit (seguridad)
]
ignore = [
    "S101",   # assert en tests
    "B008",   # Depends() en argumentos por defecto: es el idioma de FastAPI
    "RUF001", # caracteres unicode ambiguos: escribimos en español
    "RUF002",
    "RUF003",
    # Los errores del dominio se nombran por lo que ocurrió (GeoNotFound,
    # NotOwner), no con sufijo -Error: se leen mejor en los `except`.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# S311: `random` con semilla fija para los datos de demostración, no criptografía.
# S310: `powergis smoke` llama a su propio motor por una URL que da el operador;
#       no es entrada de usuario ni de red.
"src/powergis/cli.py" = ["S311", "S310"]
"alembic/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["powergis"]

# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.12"
packages = ["powergis"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "celery.*", "xlsxwriter.*", "pptx.*", "weasyprint.*"]
ignore_missing_imports = true
