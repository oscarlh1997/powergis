# Teselas vectoriales PMTiles servidas como estáticos.
#
# Sin servidor de teselas y sin coste por petición: las geometrías se generan
# una vez (mapshaper → tippecanoe → PMTiles) y se sirven con caché larga.
# Los VALORES no están aquí: viajan en el payload del informe y se unen en el
# cliente con `setFeatureState`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/tiles;

    # PMTiles necesita peticiones por rango de bytes.
    add_header Accept-Ranges bytes;

    location / {
        add_header Access-Control-Allow-Origin "https://powergis.es" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length" always;

        # Las geometrías administrativas cambian una vez al año.
        add_header Cache-Control "public, max-age=2592000, immutable";

        types {
            application/octet-stream pmtiles;
            application/x-protobuf    pbf;
        }

        gzip off;   # los .pbf ya vienen comprimidos
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
